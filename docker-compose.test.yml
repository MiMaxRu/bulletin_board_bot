version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulletin_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  tests:
    build: .
    command: pytest -q
    env_file:
      - .env.test
    depends_on:
      - postgres

volumes:
  pgdata_test:
