name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy .
      - name: Tests (pytest)
        run: pytest -q
