version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulletin
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    environment:
      - ENV=production
    env_file:
      - .env.prod
    depends_on:
      - postgres

volumes:
  pgdata:
