[tool.poetry]
name = "bulletin_board_bot"
version = "0.1.0"
description = "Async bulletin board service with aiogram"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
aiogram = "^3.0.0"
SQLAlchemy = "^2.0"
asyncpg = "^0.27"
loguru = "^0.7.0"
python-dotenv = "^1.0"
alembic = "^1.10"
pytest = {version = "^7.0", optional = true}
pytest-asyncio = {version = "^0.21", optional = true}

[tool.poetry.dev-dependencies]
mypy = "^1.0"
ruff = "^0.18"

[tool.ruff]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = 3.11
strict = true
